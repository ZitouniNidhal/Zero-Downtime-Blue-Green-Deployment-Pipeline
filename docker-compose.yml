services:
  nginx:
    image: nginx:1.27-alpine
    container_name: bg-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app-blue
      - app-green
    networks:
      - bgnet

  app-blue:
    build: ./app
    container_name: app-blue
    image: ${IMAGE_NAME:-bluegreen-app}:${BLUE_TAG:-v2}
    environment:
      - APP_VERSION=${BLUE_TAG:-v2}
      - DEPLOY_COLOR=blue
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${POSTGRES_DB:-appdb}
      - DB_USER=${POSTGRES_USER:-app}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-app}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bgnet
    restart: unless-stopped

  app-green:
    build: ./app
    container_name: app-green
    image: ${IMAGE_NAME:-bluegreen-app}:${GREEN_TAG:-v2}
    environment:
      - APP_VERSION=${GREEN_TAG:-v2}
      - DEPLOY_COLOR=green
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${POSTGRES_DB:-appdb}
      - DB_USER=${POSTGRES_USER:-app}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-app}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bgnet
    restart: unless-stopped

  # Shared database so switching traffic never causes data loss.
  db:
    image: postgres:16-alpine
    container_name: bg-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-app}
      - POSTGRES_DB=${POSTGRES_DB:-appdb}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - bgnet

networks:
  bgnet:
    driver: bridge

volumes:
  db_data:

