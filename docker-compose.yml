services:
  nginx:
    image: nginx:1.27-alpine
    container_name: bg-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app-blue
      - app-green
    networks:
      - bgnet

  app-blue:
    build: ./app
    container_name: app-blue
    image: ${IMAGE_NAME:-bluegreen-app}:${BLUE_TAG:-v1}
    environment:
      - APP_VERSION=${BLUE_TAG:-v1}
      - DEPLOY_COLOR=blue
    networks:
      - bgnet
    restart: unless-stopped

  app-green:
    build: ./app
    container_name: app-green
    image: ${IMAGE_NAME:-bluegreen-app}:${GREEN_TAG:-v1}
    environment:
      - APP_VERSION=${GREEN_TAG:-v1}
      - DEPLOY_COLOR=green
    networks:
      - bgnet
    restart: unless-stopped

  # Shared database so switching traffic never causes data loss.
  db:
    image: postgres:16-alpine
    container_name: bg-db
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
      - POSTGRES_DB=appdb
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - bgnet

networks:
  bgnet:
    driver: bridge

volumes:
  db_data:
