worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # The active upstream file is swapped by deploy.sh between
    # upstream_blue.conf and upstream_green.conf, then nginx is
    # reloaded (nginx -s reload) for a zero-downtime switch.
    include /etc/nginx/conf.d/active_upstream.conf;

    server {
        listen 80;

        location / {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
            proxy_pass http://app_backend/health;
        }
    }
}
